name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужен для сравнения штампа сборки с HEAD

      - name: Check toolchain
        run: |
          openssl version
          python3 --version

      - name: Self-tests (hierarchy + real pinned chain)
        run: python3 scripts/verify.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: JS tests + build page
        run: |
          cd web
          npm ci
          npm test

      - name: Check docs/index.html matches its build stamp
        run: |
          commit=$(grep -o 'data-commit="[0-9a-f]*"' docs/index.html | head -1 | cut -d'"' -f2)
          if [ -z "$commit" ]; then
            echo "::error::в docs/index.html нет штампа сборки — запустите 'cd web && npm run release'"
            exit 1
          fi
          git diff --quiet "$commit" HEAD -- web allowed-domains.txt pinned pinned-fingerprints.json || {
            echo "::error::исходники изменились после штампа ($commit) — запустите 'cd web && npm run release'"
            exit 1
          }
          ( cd web && npm run build -- --commit "$commit" --repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" )
          git diff --exit-code -- docs/index.html || {
            echo "::error::docs/index.html не совпадает с пересборкой из штампа $commit — запустите 'cd web && npm run release'"
            exit 1
          }

  drift-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned fingerprint against known sources
        run: |
          expected=$(python3 -c "import json;print(json.load(open('pinned-fingerprints.json'))['mincifry_root']['sha256'])")
          ok=0
          for url in $(python3 -c "import json;print('\n'.join(json.load(open('pinned-fingerprints.json'))['mincifry_root']['sources']))"); do
            got=$(curl -fsSL "$url" | openssl x509 -outform DER 2>/dev/null | sha256sum | awk '{print toupper($1)}' || true)
            echo "$url -> ${got:-FETCH_FAILED}"
            if [ "$got" = "$expected" ]; then ok=1; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::pinned fingerprint does not match any source — Mincifry root may have rotated"
            gh issue create \
              --title "Mincifry root certificate changed — manual review required" \
              --body "Weekly drift-check: pinned SHA256 \`$expected\` did not match any listed source in pinned-fingerprints.json. Update pinned/mincifry-root.crt via a reviewed PR." || true
            exit 1
          fi

      - name: Live E2E
        run: python3 scripts/verify.py --e2e

  deploy-pages:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages content
        run: |
          mkdir -p pages_dist/pinned
          cp docs/index.html pages_dist/
          cp allowed-domains.txt pages_dist/
          cp pinned-fingerprints.json pages_dist/
          cp pinned/mincifry-root.crt pages_dist/pinned/
          cp pinned/mincifry-sub-ca.crt pages_dist/pinned/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages_dist

      - id: deployment
        uses: actions/deploy-pages@v4
